title: AI product lead at a fintech company
# Synthetic vacancy written for this repo. The company is invented.
input: |
  Напиши сопроводительное письмо под эту вакансию.

  Руководитель ИИ-продуктов, финтех-компания «Северный кредит» (вымышленная).
  Задачи: запускать ИИ-решения в кредитном процессе и доводить их до промышленной эксплуатации;
